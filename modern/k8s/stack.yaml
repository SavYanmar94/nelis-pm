apiVersion: v1
kind: ConfigMap
metadata:
  name: nelis-config
data:
  DB_URL: jdbc:oracle:thin:@oracle.example.internal:1521/FREEPDB1
  RESOURCE_URL: http://resource-service:8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: resource-service }
  template:
    metadata:
      labels: { app: resource-service }
    spec:
      containers:
        - name: app
          image: ghcr.io/replace-me/nelis-resource:replace-me
          ports: [{ containerPort: 8081 }]
          env:
            - { name: DB_USER, value: NELIS_RESOURCE }
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: nelis-config, key: DB_URL } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nelis-db, key: resource-password } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
spec:
  selector: { app: resource-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: project-service }
  template:
    metadata:
      labels: { app: project-service }
    spec:
      containers:
        - name: app
          image: ghcr.io/replace-me/nelis-project:replace-me
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DB_USER, value: NELIS_PROJECT }
            - { name: DB_URL, valueFrom: { configMapKeyRef: { name: nelis-config, key: DB_URL } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nelis-db, key: project-password } } }
            - { name: RESOURCE_URL, valueFrom: { configMapKeyRef: { name: nelis-config, key: RESOURCE_URL } } }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
spec:
  selector: { app: project-service }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nelis-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: nelis-web }
  template:
    metadata:
      labels: { app: nelis-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/replace-me/nelis-web:replace-me
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true }
---
apiVersion: v1
kind: Service
metadata:
  name: nelis-web
spec:
  selector: { app: nelis-web }
  ports: [{ port: 8080, targetPort: 8080 }]
