server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location /api/resources { proxy_pass http://resource-service:8081; }
    location /api/reservations { proxy_pass http://resource-service:8081; }
    location /api/ { proxy_pass http://project-service:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
